
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Player Pro_L19</title>
    <style>
        :root { 
            --primary-color: #ff4500; 
            --bg-color: #121212; 
            --panel-bg: #1e1e1e; 
            --accent-blue: #007bff; 
            --accent-green: #28a745; 
            --gemini-blue: #4285f4;
            --memo-bg: #2a2a2a; 
            --active-bg: #555555; 
            --active-border: #777777;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); color: #e0e0e0; margin: 0; padding: 10px; 
            display: flex; flex-direction: column; align-items: center; 
        }
        .container { width: 100%; max-width: 600px; padding-bottom: 60px; }
        
        .video-selector { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; justify-content: center; }
        .video-btn { flex: 1 1 30%; min-width: 80px; padding: 14px 5px; background: #2c2c2c; border: 1px solid #444; color: #fff; cursor: pointer; border-radius: 8px; font-size: 13px; }
        .video-btn.active { background: var(--active-bg); border-color: var(--active-border); font-weight: bold; }

#player-container { 
    width: 100%; 
    aspect-ratio: 32 / 9; /* 16/9 の縦を半分に */
    background: #000; 
    border-radius: 12px; 
    overflow: hidden; 
    position: sticky; 
    top: 0; 
    z-index: 100; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
}

        #player { width: 100%; height: 100%; }

        .panel { margin-top: 15px; background: var(--panel-bg); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        .control-group { display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; align-items: center; }
        .label { font-size: 11px; color: #888; width: 100%; margin-bottom: 2px; border-left: 3px solid var(--primary-color); padding-left: 8px; text-transform: uppercase; }
        
        button { 
            flex: 1; min-width: 50px; padding: 14px 2px; border: none; border-radius: 10px; 
            background: #333; color: white; cursor: pointer; font-size: 14px; -webkit-tap-highlight-color: transparent; 
        }
        button:active { background: #555; transform: scale(0.96); }
        
        .speed-btn.active, .loop-btn.active { background: var(--active-bg); border: 1px solid var(--active-border); }
        .cc-btn { background: #444; font-size: 11px; }
        
        #status { 
            text-align: center; font-family: monospace; font-size: 1.1em; color: #00ffcc; 
            background: #000; padding: 10px; border-radius: 8px; margin-top: 5px; 
        }

        #memo-area { 
            width: 100%; height: 120px; background: var(--memo-bg); color: #fff; 
            border: 1px solid #444; border-radius: 10px; padding: 12px; 
            box-sizing: border-box; font-size: 16px; line-height: 1.5; resize: none;
        }
        .save-status { font-size: 11px; color: var(--accent-green); text-align: right; height: 14px; }

        .gemini-btn, .script-btn { 
            font-weight: bold; margin-top: 10px; display: flex; align-items: center; 
            justify-content: center; gap: 10px; height: 55px; color: white; 
            border-radius: 12px; text-decoration: none; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .gemini-btn { background: linear-gradient(135deg, #4285f4, #34a853) !important; }
        .script-btn { background: #444; cursor: pointer; border: none; width: 100%; }

        #script-display { 
            margin-top: 10px; padding: 15px; background: #000; border-radius: 10px; 
            font-size: 15px; line-height: 1.6; color: #ccc; white-space: pre-wrap; 
            display: none; max-height: 300px; overflow-y: auto; border: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="video-selector">
        <button class="video-btn active" onclick="switchVideo('Ix2uUDv0c0E', this, 'L19_1.txt')">L19-1</button>
        <button class="video-btn" onclick="switchVideo('ytO_cBnosNM', this, 'L19_2.txt')">L19-2</button>
        <button class="video-btn" onclick="switchVideo('GF9w1pzwvI8', this, 'L19_3.txt')">L19-3</button>
        <button class="video-btn" onclick="switchVideo('yAEICWDl4w8', this, 'L19_4.txt')">L19-4</button>
        <button class="video-btn" onclick="switchVideo('LmirQDCi_24', this, 'L19_5.txt')">L19-5</button>
    </div>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <div class="panel">
        <div class="label">Speed</div>
        <div class="control-group">
            <button class="speed-btn" onclick="setSpeed(0.2, this)">0.2x</button>
            <button class="speed-btn" onclick="setSpeed(0.5, this)">0.5x</button>
            <button class="speed-btn active" onclick="setSpeed(1.0, this)">1.0x</button>
        </div>

        <div class="label">Seek</div>
        <div class="control-group">
            <button onclick="seek(-0.5)">-0.5s</button>
            <button onclick="seek(-2.0)">-2.0s</button>
            <button style="background:#555;" onclick="seek(3.0)">+3.0s</button>
        </div>

        <div class="label">Captions</div>
        <div class="control-group">
            <button class="cc-btn" onclick="setCaption('en')">EN ON</button>
            <button class="cc-btn" onclick="setCaption('ja')">JA ON</button>
            <button class="cc-btn" onclick="setCaption('none')">OFF</button>
        </div>

        <div class="label">A-B Loop</div>
        <div class="control-group">
            <button onclick="setPoint('A')">A点</button>
            <button onclick="setPoint('B')">B点</button>
            <button id="btnLoop" class="loop-btn" onclick="toggleLoop()">LOOP: OFF</button>
            <button onclick="resetLoop()">Reset</button>
        </div>
        <div id="status">A: -- | B: --</div>
    </div>

    <div class="panel">
        <button class="script-btn" onclick="toggleScript()">スクリプトを表示</button>
        <div id="script-display"></div>
        
<a href="https://gemini.google.com/app/b5a9097fe818b869" target="_self" rel="noopener noreferrer" class="gemini-btn">
    <span style="font-size: 1.2em; margin-right: 5px;">?</span> Geminiに相談する
</a>
    </div>

    <div class="panel">
        <div class="label">Notes & AI Coach</div>
        <textarea id="memo-area" placeholder="メモを入力..."></textarea>
        <div class="save-status" id="save-msg"></div>
        <div class="control-group">
            <button style="background: var(--accent-blue);" onclick="saveMemo()">保存</button>
            <button style="background: #555;" onclick="clearMemo()">消去</button>
        </div>
    </div>
</div>

<script>
    let player;
    let pointA = null, pointB = null;
    let isLooping = false;
    let loopCheckInterval = null;
    let currentScriptFile = 'L04_1.txt';

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: 'Ix2uUDv0c0E',
            playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'modestbranding': 1, 'cc_load_policy': 1 },
            events: { 'onStateChange': onPlayerStateChange }
        });
    }

    window.switchVideo = function(id, btn, scriptFile) {
        if(player && player.loadVideoById) {
            player.loadVideoById(id); 
            resetLoop();
            currentScriptFile = scriptFile;
            document.getElementById('script-display').style.display = 'none';
            document.querySelectorAll('.video-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    };

    window.setSpeed = function(rate, btn) {
        if(player && player.setPlaybackRate) {
            player.setPlaybackRate(rate);
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    };

    window.seek = function(sec) {
        if(player) player.seekTo(player.getCurrentTime() + sec, true);
    };



window.setCaption = function(lang) {
    if (!player) return;
    if (lang === 'none') {
        player.unloadModule('captions');
    } else {
        player.loadModule('captions');
        
        // 字幕の言語を設定
        player.setOption('captions', 'track', {'languageCode': lang});
        
        // 字幕のフォントサイズを大きく設定 (0?3の範囲、3が最大級)
        // プレーヤーが小さい場合でも見やすくなるよう「3」に設定します
        player.setOption('captions', 'fontSize', 3); 
        
        // 補足：表示位置などをリセットして見やすくする場合
        player.setOption('captions', 'reload', true);
    }
};



    window.setPoint = function(type) {
        if(!player) return;
        const now = player.getCurrentTime();
        if (type === 'A') pointA = now; else pointB = now;
        updateStatus();
    };

    window.toggleLoop = function() {
        if (pointA === null || pointB === null) return alert("A/B点をセットしてください");
        isLooping = !isLooping;
        const btn = document.getElementById('btnLoop');
        btn.innerText = isLooping ? "LOOP: ON" : "LOOP: OFF";
        btn.classList.toggle('active', isLooping);
    };

    window.resetLoop = function() {
        pointA = pointB = null; isLooping = false;
        const btn = document.getElementById('btnLoop');
        if(btn) { btn.innerText = "LOOP: OFF"; btn.classList.remove('active'); }
        updateStatus();
    };

    function updateStatus() {
        document.getElementById('status').innerText = `A: ${pointA ? pointA.toFixed(2) : '--'}s | B: ${pointB ? pointB.toFixed(2) : '--'}s`;
    }

    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING) {
            if (loopCheckInterval) clearInterval(loopCheckInterval);
            loopCheckInterval = setInterval(() => {
                if (isLooping && pointA !== null && pointB !== null) {
                    const now = player.getCurrentTime();
                    if (now >= pointB || now < pointA - 0.2) {
                        player.seekTo(pointA, true);
                    }
                }
            }, 100);
        } else {
            clearInterval(loopCheckInterval);
            loopCheckInterval = null;
        }
    }

    window.toggleScript = async function() {
        const display = document.getElementById('script-display');
        if (display.style.display === 'block') {
            display.style.display = 'none';
        } else {
            display.innerText = "読み込み中...";
            display.style.display = 'block';
            try {
                const url = `https://mzhashim.github.io/nhk_english/2021/${currentScriptFile}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error();
                const text = await response.text();
                display.innerText = text;
            } catch (e) {
                display.innerText = "スクリプトの取得に失敗しました。";
            }
        }
    };

    window.saveMemo = function() {
        localStorage.setItem('yt_study_memo', document.getElementById('memo-area').value);
        const msg = document.getElementById('save-msg');
        msg.innerText = "Saved!"; setTimeout(() => msg.innerText = "", 2000);
    };

    window.clearMemo = function() {
        if (confirm("消去しますか？")) {
            document.getElementById('memo-area').value = "";
            localStorage.removeItem('yt_study_memo');
        }
    };

    window.addEventListener('load', () => {
        const saved = localStorage.getItem('yt_study_memo');
        if (saved) document.getElementById('memo-area').value = saved;
    });
</script>

</body>
</html>
